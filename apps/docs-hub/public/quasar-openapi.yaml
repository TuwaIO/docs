          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "404":
          description: "`invoice_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "409":
          description: "`invoice_not_open`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "429":
          description: The rate limit of the organization.
  /v1/payments/invoices/{id}/events:
    get:
      tags:
        - Invoices
      summary: Read the ledger
      description: Every step of the invoice, chained by hashes.
      security: *a1
      parameters:
        - schema:
            type: string
            description: Invoice ID.
          required: true
          description: Invoice ID.
          name: id
          in: path
        - schema:
            type: string
            enum:
              - "true"
              - "false"
            description: "`true` checks the hash chain."
          required: false
          description: "`true` checks the hash chain."
          name: verify
          in: query
      responses:
        "200":
          description: The ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceLedger"
        "401":
          description: Missing or invalid key.
        "403":
          description: "`payments_disabled`: the app is not a Payments app or the node does not run Payments."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "404":
          description: "`invoice_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "429":
          description: The rate limit of the organization.
  /v1/payments/invoices/{id}/documents/{kind}:
    get:
      tags:
