  /v1/payments/checkout/{token}/events:
    get:
      tags:
        - Checkout
      summary: Follow the invoice
      description: "Server-sent events: one `status` event at once and on every change (data: `CheckoutStatusEvent`), a `ping`
        every 15 seconds; the stream ends on a final state, once no payment of the invoice is on its way (a payment sent
        before the expiry or the cancellation, or a second payment of a paid invoice, is followed to its record), or
        after 10 minutes. No key: the token opens this invoice only; a browser may call from the app's domains (any,
        when it lists none)."
      parameters:
        - schema:
            type: string
            description: The checkout token of the invoice.
          required: true
