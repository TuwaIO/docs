                        type: object
                        properties:
                          type:
                            type: string
                          data: {}
                        required:
                          - type
                  required:
                    - chainId
                    - to
                    - permission
                    - rules
              required:
                - status
                - methodId
                - request
            - type: object
              properties:
                status:
                  type: string
                  enum:
                    - active
                permission:
                  type:
                    - object
                    - "null"
                  properties:
                    status:
                      type: string
                      enum:
                        - active
                        - revoked
                        - expired
                    chainId:
                      type:
                        - string
                        - "null"
                    methodId:
                      type:
                        - string
                        - "null"
                    payer:
                      type:
                        - string
                        - "null"
                    tokenAddress:
                      type:
                        - string
                        - "null"
                    periodAmount:
                      type:
                        - string
                        - "null"
                    periodSeconds:
                      type: number
                    startsAt:
                      type:
                        - string
                        - "null"
                    expiresAt:
                      type:
                        - string
                        - "null"
                    grantedAt:
                      type:
                        - string
                        - "null"
                    revokedAt:
                      type:
                        - string
                        - "null"
                  required:
                    - status
                    - chainId
                    - methodId
                    - payer
                    - tokenAddress
                    - periodAmount
                    - periodSeconds
                    - startsAt
                    - expiresAt
                    - grantedAt
                    - revokedAt
                  description: The ERC-7715 permission of `auto_charge`, without its context.
              required:
                - status
                - permission
            - type: object
              properties:
                status:
                  type: string
                  enum:
                    - unavailable
                reason:
                  type: string
              required:
                - status
                - reason
            - type: "null"
          description: "For a subscription with automatic charges: the ERC-7715 request to show the wallet."
      required:
        - object
        - merchant
        - invoice
        - buyer
        - methods
        - quote
        - autoCharge
      description: What a checkout token opens.
    CheckoutQuote:
      type:
        - object
        - "null"
      properties:
        object:
          type: string
          enum:
            - checkout_quote
        methodId:
          type: string
        payer:
          type:
            - string
            - "null"
        cryptoAmountExpected:
          type: string
        amountToSend:
          type: string
        transferFee:
          type:
            - object
            - "null"
          properties:
            bps:
              type: number
            maxFee:
              type:
                - string
                - "null"
            source:
              type: string
              enum:
                - contract
                - method
          required:
            - bps
            - maxFee
            - source
        decimals:
          type: number
        symbol:
          type: string
        lockedAt:
          type:
            - string
            - "null"
        expiresAt:
          type:
            - string
            - "null"
        reference:
          type:
            - string
            - "null"
        rates: {}
        markupBps:
          type: number
        discountBps:
          type: number
        instructions:
          $ref: "#/components/schemas/PaymentInstructions"
        gasless:
          type:
            - object
            - "null"
          properties:
            relay:
              type: object
              properties:
                typedData:
                  type: object
                  properties:
                    domain:
                      type: object
                      additionalProperties: {}
                    types:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            type:
                              type: string
                          required:
                            - name
                            - type
                    primaryType:
                      type: string
                    message:
                      type: object
                      additionalProperties:
                        type: string
                  required:
                    - domain
                    - types
                    - primaryType
                    - message
              required:
                - typedData
            paymaster:
              type: object
              properties:
                calls:
                  type: array
                  items:
                    type: object
                    properties:
                      to:
                        type: string
                      value:
                        type: string
                      data:
                        type: string
                    required:
                      - to
                      - value
                      - data
              required:
                - calls
          description: "What the merchant sponsors: sign `relay.typedData` (EIP-3009) and post it to `relay`, or send
            `paymaster.calls` with the `paymaster` route as the ERC-7677 paymaster service."
      required:
        - object
        - methodId
        - payer
        - cryptoAmountExpected
        - amountToSend
        - transferFee
        - decimals
        - symbol
        - lockedAt
        - expiresAt
        - reference
        - markupBps
        - discountBps
        - instructions
        - gasless
      description: A quote locked to the payer until `expiresAt`.
    PaymentInstructions:
      oneOf:
        - type: object
          properties:
            family:
              type: string
              enum:
                - eip155
            chainId:
              type: number
            to:
              type: string
            token:
              type: string
            amount:
              type: string
            decimals:
              type: number
            symbol:
              type: string
          required:
            - family
            - chainId
            - to
            - token
            - amount
            - decimals
            - symbol
        - type: object
          properties:
            family:
              type: string
              enum:
                - solana
            chainId:
              type: string
            to:
              type: string
            token:
              type: string
            amount:
              type: string
            decimals:
              type: number
            symbol:
              type: string
            reference:
              type: string
            solanaPayUrl:
              type: string
          required:
            - family
            - chainId
            - to
            - token
            - amount
            - decimals
            - symbol
            - reference
            - solanaPayUrl
      description: "What the wallet sends: the exact amount in base units to `to`; Solana transfers carry `reference`."
    CheckoutStatusEvent:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/InvoiceStatus"
        ledgerSeq:
          type: number
        txHash:
          type:
            - string
            - "null"
        amountPaid:
          type:
            - string
            - "null"
        quoteExpiresAt:
          type:
            - string
            - "null"
      required:
        - status
        - ledgerSeq
        - txHash
        - amountPaid
        - quoteExpiresAt
  parameters: {}
paths:
  /v1/engine/pulsar/sync:
    post:
      summary: Sync a transaction
      description: Sends a transaction created by Pulsar to Quasar, which tracks it on the server until it reaches a final
        status and then sends the webhooks of the app. Used by `quasar.pulsar.syncCreate`.
      tags:
        - Pulsar
      security:
        - SecretKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "200":
          description: "Synced; tracking started (`mode: fast`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessCreateResponse"
        "202":
          description: "Synced; tracking queued (`mode: lazy`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessCreateResponse"
        "400":
          description: The body is not a valid transaction or exceeds the safety limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Public key (read-only), disabled app, or IP address or origin not allowed by the app settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests per second for the app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/engine/pulsar/sync/{txKey}/hash:
    post:
      summary: Send the hash of an EIP-5792 batch
      description: "Sends the hash of the transaction that executed an EIP-5792 batch (`tracker: eip5792`), which was synced
        by its batch ID. Quasar then tracks the batch on-chain by the hash, like an Ethereum transaction; the record
        keeps the batch ID as `txKey`. A batch whose hash never arrives is marked `Failed` an hour after it was synced.
        Used by `quasar.pulsar.syncHash`."
      tags:
        - Pulsar
      security:
        - SecretKey: []
      parameters:
        - schema:
            type: string
            description: The batch ID, the `txKey` of the transaction.
          required: true
          description: The batch ID, the `txKey` of the transaction.
          name: txKey
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchHashRequest"
      responses:
        "200":
          description: "The hash is recorded and on-chain tracking started, or Quasar already had it (`duplicate: true`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchHashResponse"
        "400":
          description: The hash is malformed, or the transaction is not an EIP-5792 batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The app has no transaction with this `txKey`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The batch has another hash, or it is already final.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/engine/pulsar/history:
    get:
      summary: Read the transaction history
      description: Returns the transactions of the app, newest first, filtered by every given filter. Used by
        `quasar.pulsar.getHistory`.
      tags:
        - Pulsar
      security:
        - SecretKey: []
      parameters:
        - schema:
            type:
              - number
              - "null"
            default: 1
            description: Page number (1-indexed).
            example: 1
          required: false
          description: Page number (1-indexed).
          name: page
          in: query
        - schema:
            type:
              - number
              - "null"
            default: 10
            description: Transactions per page, at most 100.
            example: 10
          required: false
          description: Transactions per page, at most 100.
          name: limit
          in: query
        - schema:
            type: string
            description: Sender address. EVM addresses match in any letter case, Solana addresses exactly.
          required: false
          description: Sender address. EVM addresses match in any letter case, Solana addresses exactly.
          name: walletAddress
          in: query
        - schema:
            type: string
            description: 'Chain of the transactions: an EVM chain ID, or a Solana chain ID in either form
              ("solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp" or "solana:mainnet"), which match the same cluster.'
            example: "1"
          required: false
          description: 'Chain of the transactions: an EVM chain ID, or a Solana chain ID in either form
            ("solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp" or "solana:mainnet"), which match the same cluster.'
          name: chainId
          in: query
        - schema:
            type: string
            description: "Final status: `Success`, `Failed` or `Replaced`."
            example: Success
          required: false
          description: "Final status: `Success`, `Failed` or `Replaced`."
          name: status
          in: query
        - schema:
            type: string
            description: Key of one transaction.
          required: false
          description: Key of one transaction.
          name: txKey
          in: query
        - schema:
            type: string
            description: Application name passed when the transaction was synced.
          required: false
          description: Application name passed when the transaction was synced.
          name: appName
          in: query
      responses:
        "200":
          description: Paginated transaction history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedHistoryResponse"
        "401":
          description: Missing or invalid key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: The quota of the organization is used up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests per second for the app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/engine/monitoring/health:
    get:
      summary: Check the health of the API
      description: Public, without a key. Used by `preFlightTxCheck` from `@tuwaio/quasar-sdk/react`.
      tags:
        - Monitoring
      responses:
        "200":
          description: The database and Redis respond.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The primary database or Redis does not respond.
  /v1/payments/invoices:
    post:
      tags:
        - Invoices
      summary: Issue an invoice
      description: Issues a numbered invoice with its PDF (and e-invoice, when on and the buyer details allow) and sends
        `invoice.issued`. Used by `quasar.payments.createInvoice`.
      security: &a1
        - SecretKey: []
      parameters:
        - schema:
            type: string
            description: "1–255 characters: a retry with the same key returns what the first call created, with the same link."
          required: false
          description: "1–255 characters: a retry with the same key returns what the first call created, with the same link."
          name: Idempotency-Key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
      responses:
        "201":
          description: The invoice, its checkout token and payment page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceWithCheckout"
        "400":
          description: "`invalid_request` with `issues`, `seller_details_missing`, `buyer_reference_required`,
            `invalid_idempotency_key`…"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "401":
          description: Missing or invalid key.
        "403":
          description: "`payments_disabled`: the app is not a Payments app or the node does not run Payments."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "429":
          description: The rate limit of the organization.
    get:
      tags:
        - Invoices
      summary: List invoices
      description: Newest first. Used by `quasar.payments.listInvoices`.
      security: *a1
      parameters:
        - schema:
            type: string
            description: One status or several, comma-separated.
          required: false
          description: One status or several, comma-separated.
          name: status
          in: query
        - schema:
            $ref: "#/components/schemas/PaymentsEnvironment"
          required: false
          description: "Live or test: the key that issued it decides. Test invoices are paid on test networks."
          name: environment
          in: query
        - schema:
            type: string
          required: false
          name: externalId
          in: query
        - schema:
            type: string
          required: false
          name: createdAfter
          in: query
        - schema:
            type: string
          required: false
          name: createdBefore
          in: query
        - schema:
            type: integer
            description: 1 to 100. Defaults to 20.
          required: false
          description: 1 to 100. Defaults to 20.
          name: limit
          in: query
        - schema:
            type: string
          required: false
          name: cursor
          in: query
      responses:
        "200":
          description: A page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceList"
        "400":
          description: "`invalid_request`, `invalid_cursor`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "401":
          description: Missing or invalid key.
        "403":
          description: "`payments_disabled`: the app is not a Payments app or the node does not run Payments."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "429":
          description: The rate limit of the organization.
  /v1/payments/invoices/{id}:
    get:
      tags:
        - Invoices
      summary: Read an invoice
      description: With its refunds and credit notes. Used by `quasar.payments.getInvoice`.
      security: *a1
      parameters:
        - schema:
            type: string
            description: Invoice ID.
          required: true
          description: Invoice ID.
          name: id
          in: path
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceDetails"
        "401":
          description: Missing or invalid key.
        "403":
          description: "`payments_disabled`: the app is not a Payments app or the node does not run Payments."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "404":
          description: "`invoice_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "429":
          description: The rate limit of the organization.
  /v1/payments/invoices/{id}/cancel:
    post:
      tags:
        - Invoices
      summary: Cancel an invoice
      description: An open invoice stops being payable; its number stays taken.
      security: *a1
      parameters:
        - schema:
            type: string
            description: Invoice ID.
          required: true
          description: Invoice ID.
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          description: Missing or invalid key.
        "403":
          description: "`payments_disabled`: the app is not a Payments app or the node does not run Payments."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "404":
          description: "`invoice_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "409":
          description: The invoice is not in a state for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "429":
          description: The rate limit of the organization.
  /v1/payments/invoices/{id}/release:
    post:
      tags:
        - Invoices
      summary: Release a held payment
      description: The invoice becomes paid and the buyer gets a receipt.
      security: *a1
      parameters:
        - schema:
            type: string
            description: Invoice ID.
          required: true
          description: Invoice ID.
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required:
                - reason
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          description: Missing or invalid key.
        "403":
          description: "`payments_disabled`: the app is not a Payments app or the node does not run Payments."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "404":
          description: "`invoice_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "409":
          description: The invoice is not in a state for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "429":
          description: The rate limit of the organization.
  /v1/payments/invoices/{id}/correct:
