            - id
            - number
            - status
            - environment
            - currency
            - total
            - totalMinor
            - lineItems
            - locale
            - dueAt
            - successUrl
            - cancelUrl
            - amountPaid
            - restPayable
            - originWallet
            - review
            - refundedTotalMinor
            - replacedBy
            - subscription
