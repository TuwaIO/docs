              schema:
                $ref: "#/components/schemas/PaymentsError"
  /v1/payments/checkout/{token}/submit:
    post:
      tags:
        - Checkout
      summary: Submit the payment transaction
      description: "Quasar tracks it; the invoice is settled when it is final. For an EIP-5792 batch, send the hash of its
        transaction. An invoice in any state takes it, since the money reaches the merchant whatever the invoice says:
        an `expired` or `cancelled` invoice holds the payment for the merchant as late (`review.reason` `late`), who
        credits or returns it; an invoice `paid`, `held` or `refunded` already records it with its amount as a payment
        that pays nothing (`rejectedPayments`, `invoice_not_payable` or `payer_mismatch`, `movedMoney`). One handed over
        before `dueAt` keeps the invoice payable for up to 30 minutes past it while it confirms; one handed over after
        `dueAt` is held as late, even while another payment keeps the invoice payable. The same `txKey` is taken once,
        and a `txKey` Quasar tracks for this invoice already is answered as taken before anything else is checked: a
        page that got no answer (network, 5xx) hands it over again, also after a reload (`@tuwaio/quasar-sdk` keeps the
        hand-over in the tab until it is taken), since the wallet has sent it already. A `txKey` Quasar tracks for
        another invoice of the app is `409 tx_already_used`, never taken: EVM invoices share the merchant's address and
        carry no reference, so whoever saw the hash may have handed it over for their own invoice first. For a payment,
        with a locked quote, Quasar records this invoice's claim on it (once; at most 3 undecided claims) and credits
        the transaction to the invoice of the organization it is tied to by proof (its mark: a Solana Pay reference, a
        relay or an automatic charge; or a sender whose wallet confirmed that invoice with `payer-proof`), exact amount
        first, then the later quote: when that is this invoice it moves here; otherwise this invoice lists it in
        `rejectedPayments` with `tx_already_used`. A transfer tied to no invoice that reached the merchant is held on
        the invoice for a refund only (`review.refundOnly`). A transaction is found by its `txKey` and by its executed
        hash. Until then the claim counts in `pendingPayments` and `unresolvedPayments` (and in `onTimeTxKeys` when made
        before `dueAt`): the page tells the buyer that the transaction was handed over for another invoice and offers no
        second payment. No key: the token opens this invoice only; a browser may call from the app's domains (any, when
        it lists none)."
      parameters:
        - schema:
            type: string
            description: The checkout token of the invoice.
          required: true
          description: The checkout token of the invoice.
          name: token
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                txKey:
                  type: string
                  description: Transaction hash or Solana signature.
                from:
                  type: string
                  description: The sender, for a Solana Pay quote without a payer.
                connectorType:
                  type: string
              required:
                - txKey
      responses:
        "202":
          description: Taken, also when Quasar tracks the `txKey` (or a transaction with that hash) for this invoice already.
            `status` is the state of the invoice.
          content:
            application/json:
              schema:
                type: object
                properties:
                  txKey:
                    type: string
                  status:
                    type: string
                required:
                  - txKey
                  - status
        "400":
          description: "`invalid_request` with `issues`, `invalid_transaction`, `sender_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "403":
          description: "`origin_not_allowed`, `payments_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "404":
          description: "`checkout_not_found`: a wrong or replaced token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "409":
          description: "`quote_required`; `too_many_pending`: the invoice already has 3 unconfirmed transactions, wait until one
            is confirmed or fails; `tx_already_used`: Quasar tracks the transaction for another invoice of the app (this
            invoice's claim is recorded, see above): not a refusal of the payment, so never offer a second one for it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "429":
          description: "`rate_limited`: 120 calls a minute per token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
  /v1/payments/checkout/{token}/relay:
    post:
      tags:
        - Checkout
      summary: Pay without gas (EIP-3009)
      description: "The signature of `quote.gasless.relay.typedData`: the app relayer sends the transfer and the merchant pays
        the gas. The signed authorization confirms the wallet for the invoice (`payerProofs`, kind `authorization`).
        When someone else sent a copy of the authorization first, the relay reverts while the copy moves the money:
        Quasar finds the copy and tracks it as this invoice's payment. No key: the token opens this invoice only; a
        browser may call from the app's domains (any, when it lists none)."
      parameters:
        - schema:
            type: string
            description: The checkout token of the invoice.
          required: true
          description: The checkout token of the invoice.
          name: token
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                signature:
                  type: string
                  description: 65-byte EIP-712 signature.
              required:
                - signature
      responses:
        "200":
          description: "`submitted` with the transaction (`txHash` may be that of a copy of the authorization someone else sent
            first), or `sending` while the receipt is slow or the chain cannot tell yet."
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - submitted
                      - sending
                  userOpHash:
                    type: string
                  txHash:
                    type: string
                required:
                  - status
        "400":
          description: "`invalid_request` with `issues`, `invalid_signature`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "403":
          description: "`origin_not_allowed`, `payments_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "404":
          description: "`checkout_not_found`: a wrong or replaced token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "409":
          description: "`gasless_unavailable`, `already_relayed`, `quote_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "429":
          description: "`sponsorship_limit` (the gas the merchant sponsors per invoice or day is used up: pay with a normal
            transfer), `rate_limited`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "502":
          description: "`relay_failed`: pay with a normal transfer or ask for a new quote."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
  /v1/payments/checkout/{token}/paymaster:
    post:
      tags:
        - Checkout
      summary: ERC-7677 paymaster
      description: "JSON-RPC `pm_getPaymasterStubData` and `pm_getPaymasterData` for the buyer's smart wallet, sponsored when
