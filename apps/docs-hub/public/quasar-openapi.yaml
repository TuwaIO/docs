          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
webhooks:
  payment-event:
    post:
      summary: Payment event (payments.v1)
      description: Sent to the webhook endpoints subscribed to `invoice:*`, `refund:*`, `subscription:*` or the event itself
        (`invoice.transfer_held` and `invoice.transfer_hold_voided`, notices, are in the default subscriptions of a shop
        endpoint). `x-quasar-signature` is the hex HMAC-SHA256 of the raw body keyed with the endpoint's signing secret;
        check it, and `sentAt`, with `verifyWebhook` of `@tuwaio/quasar-sdk`. `data.invoice` is the invoice when the
        delivery was sent.
      tags:
        - Webhooks
      parameters:
        - schema:
            type: string
          required: true
          name: x-quasar-signature
          in: header
        - schema:
            type: string
            description: The event type.
          required: true
          description: The event type.
          name: x-quasar-event
          in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentWebhookEvent"
      responses:
        "200":
          description: Answer with a `2xx` within 10 seconds; do slow work afterwards.
