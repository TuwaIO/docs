          description: "What the checkout now offers: `active` while the chain does not show the revocation yet."
          content:
            application/json:
              schema:
                type: object
                properties:
                  autoCharge:
                    description: Same as `autoCharge` of the view.
        "403":
          description: "`origin_not_allowed`, `payments_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "404":
          description: "`checkout_not_found`: a wrong or replaced token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "429":
          description: "`rate_limited`: 120 calls a minute per token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
  /v1/payments/checkout/{token}/receipt:
