      summary: Lock a quote
      description: "Screens the payer (AML) and locks the price for the method; a new quote replaces the open one. On an
        underpaid invoice it quotes the rest instead (`amountDue`): only to the wallet and in the method that paid
        first, at the rate that payment was quoted, with no consent asked again and no gasless offer, in new quote
        windows up to the due date (`rateHeldUntil` says until when the rate of a moving asset holds). A Solana Pay QR
        quote has no payer. An EVM payer must have confirmed the invoice first (`payer-proof`), checked before screening
        and pricing, unless the gasless relay may pay the method (`methods[].payerProof` `unless_relayed`). No key: the
        token opens this invoice only; a browser may call from the app's domains (any, when it lists none)."
      parameters:
        - schema:
            type: string
            description: The checkout token of the invoice.
          required: true
          description: The checkout token of the invoice.
          name: token
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                methodId:
                  type: string
                payer:
                  type: string
                  description: CAIP-10 account.
                consentGiven:
                  type: boolean
                  description: The buyer ticked the checkout `consent`; a required one must be `true`.
              required:
                - methodId
      responses:
        "200":
          description: The quote and its payment instructions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutQuote"
        "400":
          description: "`invalid_request` with `issues`, `payer_required`, `payer_chain_mismatch`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "403":
          description: "`payer_blocked` (AML), `payer_not_expected`, `origin_not_allowed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "404":
          description: "`checkout_not_found`, `method_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "409":
          description: "`payer_mismatch` (the rest of an underpaid invoice is paid from the wallet that paid first; `originWallet`
            names it), `rest_method_mismatch` (and with the method that paid first; `methodId` names it),
            `buyer_required`, `consent_required` (a required consent without `consentGiven: true`),
            `payer_proof_required` (the EVM wallet has not confirmed the invoice: `payer-proof` first; `payer` names
            it), `invoice_expired`, `invoice_processing`, `invoice_not_payable`, `amount_out_of_range`,
            `method_not_priced`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "429":
          description: "`rate_limited`: 120 calls a minute per token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "503":
          description: "`screening_unavailable` (AML in `block` mode while a source is down), `price_unavailable`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
  /v1/payments/checkout/{token}/payer-proof/message:
    post:
      tags:
        - Checkout
      summary: Get the payer proof message
      description: "The exact EIP-4361 (Sign-In with Ethereum) message an EVM wallet signs, for free and without moving funds,
        to confirm that it pays this invoice: the site of the request `Origin` (else the dashboard URL), the checksummed
        address, the statement `Pay invoice <number> of <seller> (<total> <currency>) from this wallet. Quasar credits
        this invoice with transfers from this wallet once it has signed this message. Signing moves no funds.`, the
        wallet's chain ID, a nonce derived from the invoice and the wallet, `Issued At` the invoice's creation,
        `Expiration Time` its due date and the resource `urn:quasar:invoice:<id>`. Deterministic: nothing is stored.
        Quasar credits a transfer only to an invoice it is tied to by proof: the quote's Solana Pay reference, the
        gasless relay's authorization or an automatic charge, or a sender whose wallet confirmed the invoice this way.
        Used by `confirmPayer` of `createCheckoutStore`. No key: the token opens this invoice only; a browser may call
        from the app's domains (any, when it lists none)."
      parameters:
        - schema:
            type: string
            description: The checkout token of the invoice.
          required: true
          description: The checkout token of the invoice.
          name: token
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payer:
                  type: string
                  description: CAIP-10 EVM account.
              required:
                - payer
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayerProofMessage"
        "400":
          description: "`invalid_request` with `issues`, `payer_chain_mismatch` (not an account on an EVM network the invoice is
            offered on), `origin_required` (no `Origin` and no dashboard URL to name the site)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "403":
          description: "`payer_not_expected` (the merchant expects another wallet), `data_processing_required`,
            `origin_not_allowed`, `payments_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "404":
          description: "`checkout_not_found`: a wrong or replaced token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "409":
          description: "`invoice_not_payable` (not `open`, `underpaid` or `processing`), `invoice_expired`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "429":
          description: "`rate_limited`: 120 calls a minute per token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
  /v1/payments/checkout/{token}/payer-proof:
    post:
      tags:
        - Checkout
      summary: Confirm the paying wallet
      description: "Checks the signed message byte for byte against the one `payer-proof/message` gives and the signature (an
        ordinary wallet's by EIP-191 recovery, for every EVM network; a smart wallet's through its contract on its
        network, ERC-1271 or ERC-6492, over the app's RPC) and records the confirmation in the invoice's ledger
        (`payer.confirmed`), once per wallet: asked again, it answers the recorded one without a new check. From then on
        a transfer from the wallet is credited to this invoice, and the wallet may get a quote of any method. Counts as
        a quote of the wallet against the limits. Used by `confirmPayer` of `createCheckoutStore`. No key: the token
        opens this invoice only; a browser may call from the app's domains (any, when it lists none)."
      parameters:
        - schema:
            type: string
            description: The checkout token of the invoice.
          required: true
          description: The checkout token of the invoice.
          name: token
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payer:
                  type: string
                  description: CAIP-10 EVM account.
                message:
                  type: string
                  description: The message as `payer-proof/message` gave it (up to 2,000).
                signature:
                  type: string
                  description: Hex signature, up to 8 KB (a smart wallet signs longer).
              required:
                - payer
                - message
                - signature
      responses:
        "200":
          description: The confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayerProof"
        "400":
          description: "`invalid_request` with `issues`, `payer_proof_invalid` with `reason` `message_mismatch` (ask for the
            message again) or `signature_invalid`, `payer_chain_mismatch`, `origin_required`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "403":
          description: "`payer_not_expected` (the merchant expects another wallet), `data_processing_required`,
            `origin_not_allowed`, `payments_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "404":
          description: "`checkout_not_found`: a wrong or replaced token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "409":
          description: "`invoice_not_payable` (not `open`, `underpaid` or `processing`), `invoice_expired`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "429":
          description: "`rate_limited` (30 smart-wallet checks a minute per app; 10 quotes and confirmations a minute per
            invoice), `too_many_payers` (more than 5 wallets on the invoice)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "503":
          description: "`payer_proof_unavailable` with `reason` `rpc_failed`: the network of a smart wallet cannot be asked now."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
  /v1/payments/checkout/{token}/buyer:
    post:
      tags:
        - Checkout
      summary: Send the buyer details
      description: "Issues the invoice document that waited for them; `company: true` asks for an invoice for a company. No
        key: the token opens this invoice only; a browser may call from the app's domains (any, when it lists none)."
      parameters:
