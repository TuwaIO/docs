          description: A line the buyer ticks before paying, such as a request to start a service at once; `null` when the
            merchant asks none. The quote records the tick in the ledger (`consent.given`) and the receipt email repeats
            the text.
        amlScreening:
          type: boolean
          description: "`true` when the merchant checks paying wallets before payment (its AML mode is `block` or `flag`); the
            checkout says so to the buyer only then."
        methods:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              symbol:
                type: string
              chainId:
                type: string
              assetId:
                type:
                  - string
                  - "null"
              decimals:
                type: number
              gasless:
                type:
                  - string
                  - "null"
              featured:
                type: boolean
              markupBps:
                type: number
                description: Costs this much more than the total, in basis points.
              discountBps:
                type: number
                description: Costs this much less than the total, in basis points.
              payerProof:
                type: string
                enum:
                  - before_quote
                  - unless_relayed
                  - none
                description: "When the paying wallet confirms the invoice (`payer-proof`): `before_quote` (EVM: before the price, else
                  the quote answers `409 payer_proof_required`), `unless_relayed` (an EVM method the gasless relay may
                  pay: the price first; the relay confirms the wallet itself, a transfer or a paymaster payment needs
                  the proof first), `none` (Solana: the quote reference ties the transfer)."
            required:
              - id
              - name
              - symbol
              - chainId
              - assetId
              - decimals
              - gasless
              - featured
              - markupBps
              - discountBps
        payerProofs:
          type: array
          items:
