            - type: "null"
          description: "For a subscription with automatic charges: the ERC-7715 request to show the wallet."
      required:
        - object
        - merchant
        - theme
        - invoice
        - buyer
        - consent
        - amlScreening
        - methods
        - quoteTtlSeconds
        - quote
        - autoCharge
      description: What a checkout token opens.
    CheckoutRejectedPayment:
      type: object
      properties:
        txKey:
          type: string
          description: The transaction's `txKey`, or the `userOpHash` of a gasless relay that failed before it had a transaction.
        reason:
          type: string
          description: "Why: `reverted`, `cancelled`, `expired`, `no_matching_transfer`, `reference_missing`, `too_early`,
            `tx_already_used` (the transaction pays another invoice of the merchant: the one the wallet that sent it
            confirmed, or whose mark it carries, also when this invoice handed it over first or claimed it),
            `not_found`, `timeout`, `replaced`, `payer_mismatch` (a transfer from another wallet than the quoted one)
            and `payer_unconfirmed` (from the quoted wallet, which never confirmed the invoice): final, `movedMoney`;
            with `held` Quasar recorded it as a held transfer, which the merchant returns to the wallet that sent it,
            and the invoice stays payable, `native_from_contract_unverifiable`, `invoice_not_payable` (a transfer to an
            invoice paid, held or refunded already), `settlement_failed` (the network confirmed the transaction but
            Quasar has not recorded it yet: not final, `movedMoney`; Quasar settles it again daily for 30 days after it
            learned of it, while `rechecked`), `unresolved_after_24h` (final: no result seen on chain within 24 hours,
            only for a transaction Quasar read again after that day and the network does not have), a relay reason
            (`user_operation_lost`…), or `transaction_failed`."
        final:
          type: boolean
          description: "Whether the transaction can never pay the invoice: the buyer may pay again. A final one may still have
            moved money: read `movedMoney`."
        userOpHash:
          type: string
          description: The relay operation the transaction came from.
        original:
          type: string
          description: The transaction the checkout handed over, when this one replaced it (sped up).
        movedMoney:
          type: boolean
          enum:
            - true
          description: "Set when the transaction succeeded on chain without paying the invoice (`no_matching_transfer`,
            `reference_missing`, `too_early`, `tx_already_used`, `payer_mismatch`, `payer_unconfirmed`,
            `native_from_contract_unverifiable`, `invoice_not_payable`), or Quasar has not recorded it yet
            (`settlement_failed`): it may have moved money, final or not. Never tell the buyer that it did not go
            through or that nothing was charged, and offer no plain second payment: say that this transaction does not
            pay the invoice (for `payer_mismatch` and `payer_unconfirmed`: that the merchant returns it to the wallet
            that sent it; for `settlement_failed`: that Quasar has not recorded it yet, and that it tries again daily
            only while `rechecked`; never offer a second payment for it), and to contact the merchant if money left the
            wallet."
        rechecked:
          type: boolean
          enum:
            - true
          description: "Set while Quasar still reads the transaction again: a rejection for `not_found`, `timeout` or `replaced`
            of a payment Quasar learned of within the last 24 hours that nothing has resolved since (still unresolved
            after the 24 hours, it is closed with the final reason `unresolved_after_24h`), or a `settlement_failed` one
            Quasar still settles again daily (for 30 days after it learned of the payment). Only then may the page
            promise that Quasar checks the payment again. Any other rejection that is not `final` (a relay operation
            lost, `transaction_failed`, a transfer from another wallet…) is never read again: ask the buyer to contact
            the merchant with the transaction hash if money left the wallet."
      required:
        - txKey
        - reason
        - final
    PayerProofKind:
      type: string
      enum:
        - eoa
        - eip1271
        - eip6492
        - authorization
      description: "How a wallet confirmed the invoice: `eoa` (an EIP-191 signature, valid on every EVM network), `eip1271` or
        `eip6492` (a smart wallet whose contract, deployed or not yet, accepted the signature on its network: valid
        there only), `authorization` (the EIP-3009 authorization of the gasless relay, on every EVM network)."
    CheckoutQuote:
      type:
        - object
        - "null"
      properties:
        object:
          type: string
          enum:
            - checkout_quote
        methodId:
          type: string
        payer:
          type:
            - string
            - "null"
        cryptoAmountExpected:
          type: string
          description: The whole invoice at the quoted rate, in base units.
        amountDue:
          type: string
          description: "What must still arrive, in base units: `cryptoAmountExpected`, or on an underpaid invoice what is left of
            it, at the same rate."
        amountToSend:
          type: string
          description: "`amountDue` grossed up for a transfer fee, in base units."
        rateHeldUntil:
          type:
            - string
            - "null"
          description: "On the quote of a rest in an asset that moves against the invoice currency: until when its rate holds. A
            payment after this time waits for the merchant to accept or refund it (`review.reason` `quote_expired`)."
        transferFee:
          type:
            - object
            - "null"
          properties:
            bps:
              type: number
            maxFee:
              type:
                - string
                - "null"
            source:
              type: string
              enum:
                - contract
                - method
          required:
            - bps
            - maxFee
            - source
        decimals:
          type: number
        symbol:
          type: string
        lockedAt:
          type:
            - string
            - "null"
        expiresAt:
          type:
            - string
            - "null"
        reference:
          type:
            - string
            - "null"
        rates: {}
        markupBps:
          type: number
        discountBps:
          type: number
        instructions:
          $ref: "#/components/schemas/PaymentInstructions"
        gasless:
          type:
            - object
            - "null"
          properties:
            relay:
              type: object
              properties:
                typedData:
                  type: object
                  properties:
                    domain:
                      type: object
                      additionalProperties: {}
                    types:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            type:
                              type: string
                          required:
                            - name
                            - type
                    primaryType:
                      type: string
                    message:
                      type: object
                      additionalProperties:
                        type: string
                  required:
                    - domain
                    - types
                    - primaryType
                    - message
              required:
                - typedData
            paymaster:
              type: object
              properties:
                calls:
                  type: array
                  items:
                    type: object
                    properties:
                      to:
                        type: string
                      value:
                        type: string
                      data:
                        type: string
                    required:
                      - to
                      - value
                      - data
              required:
                - calls
          description: "What the merchant sponsors: sign `relay.typedData` (EIP-3009) and post it to `relay`, or send
            `paymaster.calls` with the `paymaster` route as the ERC-7677 paymaster service."
        payerProof:
          type: object
          properties:
            required:
              type: boolean
            proven:
              type: boolean
            kind:
              allOf:
                - $ref: "#/components/schemas/PayerProofKind"
                - type:
                    - string
                    - "null"
          required:
            - required
            - proven
            - kind
          description: "Whether the quoted wallet confirmed the invoice (`payer-proof`): `required` on an EVM method, `proven`
            once it did. An unconfirmed EVM quote exists only for a method the gasless relay may pay: the relay confirms
            the wallet itself, while a transfer or a paymaster payment from it needs `payer-proof` first, or Quasar
            credits it to no invoice and the merchant returns it."
      required:
        - object
        - methodId
        - payer
        - cryptoAmountExpected
        - amountDue
        - amountToSend
        - rateHeldUntil
        - transferFee
        - decimals
        - symbol
        - lockedAt
        - expiresAt
        - reference
        - markupBps
        - discountBps
        - instructions
        - gasless
      description: A quote locked to the payer until `expiresAt`.
    PaymentInstructions:
      oneOf:
        - type: object
          properties:
            family:
              type: string
              enum:
                - eip155
            chainId:
              type: number
            to:
              type: string
            token:
              type: string
            amount:
              type: string
            decimals:
              type: number
            symbol:
              type: string
          required:
            - family
            - chainId
            - to
            - token
            - amount
            - decimals
            - symbol
        - type: object
          properties:
            family:
              type: string
              enum:
                - solana
            chainId:
              type: string
            to:
              type: string
            token:
              type: string
            amount:
              type: string
            decimals:
              type: number
            symbol:
              type: string
            reference:
              type: string
            solanaPayUrl:
              type: string
          required:
            - family
            - chainId
            - to
            - token
            - amount
            - decimals
            - symbol
            - reference
            - solanaPayUrl
      description: "What the wallet sends: the exact amount in base units to `to`; Solana transfers carry `reference`."
    PayerProofMessage:
      type: object
      properties:
        object:
          type: string
          enum:
            - payer_proof_message
        payer:
          type: string
          description: The wallet, CAIP-10, the EVM address checksummed.
        proven:
          type: boolean
          description: The wallet confirmed this invoice already (on this network, for a smart wallet).
        message:
          type: string
          description: The EIP-4361 message to sign as it is, with `personal_sign`.
        domain:
          type: string
          description: "The site the message names: the host of the request `Origin`."
        chainId:
          type: string
          description: CAIP-2 network of the wallet.
        nonce:
          type: string
        issuedAt:
          type: string
          description: When the invoice was created.
        expiresAt:
          type:
            - string
            - "null"
          description: The invoice due date.
      required:
        - object
        - payer
        - proven
        - message
        - domain
        - chainId
        - nonce
        - issuedAt
        - expiresAt
    PayerProof:
      type: object
      properties:
        object:
          type: string
          enum:
            - payer_proof
        payer:
          type: string
        proven:
          type: boolean
          enum:
            - true
        kind:
          $ref: "#/components/schemas/PayerProofKind"
        chainId:
          type: string
          description: CAIP-2 network it confirmed on.
        confirmedAt:
          type: string
      required:
        - object
        - payer
        - proven
        - kind
        - chainId
        - confirmedAt
    CheckoutStatusEvent:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/InvoiceStatus"
        ledgerSeq:
          type: number
        txHash:
          type:
            - string
            - "null"
        amountPaid:
          type:
            - string
            - "null"
        quoteExpiresAt:
          type:
            - string
            - "null"
        pendingPayments:
          type: number
          description: Payments handed over and still on their way.
        rejectedTxKeys:
          type: array
          items:
            type: string
          description: Every key of the payments that failed, latest first.
        rejectedPayments:
          type: array
          items:
            $ref: "#/components/schemas/CheckoutRejectedPayment"
          description: The payments that failed and why, latest first (at most 10).
        paymentCountsUntil:
          type:
            - string
            - "null"
          description: Until when a payment sent before `dueAt` counts; `null` without one on its way.
        unresolvedPayments:
          type: number
          description: Payments that may still arrive, with no time limit (see `CheckoutInvoice`).
        onTimeTxKeys:
          type: array
          items:
            type: string
          description: The keys of the payments that count as sent in time (see `CheckoutInvoice`).
      required:
        - status
        - ledgerSeq
        - txHash
        - amountPaid
        - quoteExpiresAt
  parameters: {}
paths:
  /v1/engine/pulsar/sync:
    post:
      summary: Sync a transaction
      description: Sends a transaction created by Pulsar to Quasar, which tracks it on the server until it reaches a final
        status and then sends the webhooks of the app. Used by `quasar.pulsar.syncCreate`.
      tags:
        - Pulsar
      security:
        - SecretKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "200":
          description: "Synced; tracking started (`mode: fast`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessCreateResponse"
        "202":
          description: "Synced; tracking queued (`mode: lazy`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessCreateResponse"
        "400":
          description: The body is not a valid transaction or exceeds the safety limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Public key (read-only), disabled app, app being deleted, or IP address or origin not allowed by the app
            settings. In Quasar Cloud also an organization whose data processing is not set up (`code:
            data_processing_required`): transactions are accepted once an owner concludes the Data Processing Addendum,
            and the standard contractual clauses where they apply, in the dashboard."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The app has no provider to track this transaction, such as an RPC endpoint, an Alchemy key or a QuickNode
            key for its chain; nothing is stored. Quasar Cloud tracks transactions only through the providers of the
            app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests per second for the app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/engine/pulsar/sync/{txKey}/hash:
    post:
      summary: Send the hash of an EIP-5792 batch
      description: "Sends the hash of the transaction that executed an EIP-5792 batch (`tracker: eip5792`), which was synced
        by its batch ID. Quasar then tracks the batch on-chain by the hash, like an Ethereum transaction; the record
        keeps the batch ID as `txKey`. A batch whose hash never arrives is marked `Failed` an hour after it was synced.
        Used by `quasar.pulsar.syncHash`; `watchBatchHashes` reads the hashes from a Pulsar store."
      tags:
        - Pulsar
      security:
        - SecretKey: []
      parameters:
        - schema:
            type: string
            description: The batch ID, the `txKey` of the transaction.
          required: true
          description: The batch ID, the `txKey` of the transaction.
          name: txKey
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchHashRequest"
      responses:
        "200":
          description: "The hash is recorded and on-chain tracking started, or Quasar already had it (`duplicate: true`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchHashResponse"
        "400":
          description: The hash is malformed, or the transaction is not an EIP-5792 batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Public key (read-only), disabled app, app being deleted, or IP address or origin not allowed by the app
            settings. In Quasar Cloud also an organization whose data processing is not set up (`code:
            data_processing_required`): transactions are accepted once an owner concludes the Data Processing Addendum,
            and the standard contractual clauses where they apply, in the dashboard."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The app has no transaction with this `txKey`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The batch has another hash, or it is already final.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests per second for the app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/engine/pulsar/history:
    get:
      summary: Read the transaction history
      description: Returns the transactions of the app, newest first, filtered by every given filter. Used by
        `quasar.pulsar.getHistory`.
      tags:
        - Pulsar
      security:
        - SecretKey: []
      parameters:
        - schema:
            type:
              - number
              - "null"
            default: 1
            description: Page number (1-indexed).
            example: 1
          required: false
          description: Page number (1-indexed).
          name: page
          in: query
        - schema:
            type:
              - number
              - "null"
            default: 10
            description: Transactions per page, at most 100.
            example: 10
          required: false
          description: Transactions per page, at most 100.
          name: limit
          in: query
        - schema:
            type: string
            description: Sender address. EVM addresses match in any letter case, Solana addresses exactly.
          required: false
          description: Sender address. EVM addresses match in any letter case, Solana addresses exactly.
          name: walletAddress
          in: query
        - schema:
            type: string
            description: 'Chain of the transactions: an EVM chain ID, or a Solana chain ID in either form
              ("solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp" or "solana:mainnet"), which match the same cluster.'
            example: "1"
          required: false
          description: 'Chain of the transactions: an EVM chain ID, or a Solana chain ID in either form
            ("solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp" or "solana:mainnet"), which match the same cluster.'
          name: chainId
          in: query
        - schema:
            type: string
            description: "Final status: `Success`, `Failed` or `Replaced`."
            example: Success
          required: false
          description: "Final status: `Success`, `Failed` or `Replaced`."
          name: status
          in: query
        - schema:
            type: string
            description: Key of one transaction.
          required: false
          description: Key of one transaction.
          name: txKey
          in: query
        - schema:
            type: string
            description: Application name passed when the transaction was synced.
          required: false
          description: Application name passed when the transaction was synced.
          name: appName
          in: query
      responses:
        "200":
          description: Paginated transaction history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedHistoryResponse"
        "401":
          description: Missing or invalid key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: The quota of the organization is used up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "A public key: the history is read with the secret key, from your server. Also a disabled app, an app being
            deleted, or an IP address or origin not allowed by the app settings."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests per second for the app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/engine/monitoring/health:
    get:
      summary: Check the health of the API
      description: Public, without a key. Used by `preFlightTxCheck` from `@tuwaio/quasar-sdk/react`.
      tags:
        - Monitoring
      responses:
        "200":
          description: The database and Redis respond.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The primary database or Redis does not respond.
  /v1/payments/invoices:
    post:
      tags:
        - Invoices
      summary: Issue an invoice
      description: Issues a numbered invoice with its PDF (and e-invoice, when on and the buyer details allow) and sends
        `invoice.issued`. Used by `quasar.payments.createInvoice`.
      security: &a1
        - SecretKey: []
      parameters:
        - schema:
            type: string
            description: "1–255 characters: a retry with the same key returns what the first call created, with the same link."
          required: false
          description: "1–255 characters: a retry with the same key returns what the first call created, with the same link."
          name: Idempotency-Key
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
      responses:
        "201":
          description: The invoice, its checkout token and payment page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceWithCheckout"
        "400":
          description: "`invalid_request` with `issues`, `seller_details_missing`, `buyer_reference_required`,
            `invalid_idempotency_key`…"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "401":
          description: Missing or invalid key.
          content:
            application/json:
              schema:
