                type: string
                description: CAIP-2 network it confirmed on.
              confirmedAt:
                type: string
            required:
              - payer
              - kind
              - chainId
              - confirmedAt
          description: "The wallets that confirmed this invoice, oldest first: one confirmation per invoice and wallet, so a
            reopened page asks none of them to sign again."
        quoteTtlSeconds:
          type: number
          description: How long a locked quote holds, in seconds.
        quote:
          $ref: "#/components/schemas/CheckoutQuote"
        autoCharge:
          oneOf:
            - type: object
              properties:
                status:
                  type: string
                  enum:
                    - available
                methodId:
                  type: string
                request:
                  type: object
                  properties:
                    chainId:
                      type: string
                    to:
                      type: string
                    permission:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                            - erc20-token-periodic
                        isAdjustmentAllowed:
                          type: boolean
                        data:
                          type: object
                          properties:
                            tokenAddress:
                              type: string
                            periodAmount:
                              type: string
                            periodDuration:
                              type: number
                            startTime:
                              type: number
                            justification:
                              type: string
                          required:
                            - tokenAddress
                            - periodAmount
                            - periodDuration
                            - startTime
                            - justification
                      required:
                        - type
                        - isAdjustmentAllowed
                        - data
                    rules:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                          data: {}
                        required:
                          - type
                  required:
                    - chainId
                    - to
                    - permission
                    - rules
              required:
                - status
                - methodId
                - request
            - type: object
              properties:
                status:
                  type: string
                  enum:
                    - active
                permission:
                  type:
                    - object
                    - "null"
                  properties:
                    status:
                      type: string
                      enum:
                        - active
                        - revoked
                        - expired
                    chainId:
                      type:
                        - string
                        - "null"
                    methodId:
                      type:
                        - string
                        - "null"
                    payer:
                      type:
                        - string
                        - "null"
                    tokenAddress:
                      type:
                        - string
                        - "null"
                    periodAmount:
                      type:
                        - string
                        - "null"
                    periodSeconds:
                      type: number
                    startsAt:
                      type:
                        - string
                        - "null"
                    expiresAt:
                      type:
                        - string
                        - "null"
                    grantedAt:
                      type:
                        - string
                        - "null"
                    revokedAt:
                      type:
                        - string
                        - "null"
                  required:
                    - status
                    - chainId
                    - methodId
                    - payer
                    - tokenAddress
                    - periodAmount
                    - periodSeconds
                    - startsAt
                    - expiresAt
                    - grantedAt
                    - revokedAt
                  description: The ERC-7715 permission of `auto_charge`, without its context.
                revocation:
