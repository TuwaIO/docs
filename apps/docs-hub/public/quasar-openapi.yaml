openapi: 3.1.0
info:
  title: Quasar API
  version: 1.0.0
  description: "The endpoints of the Quasar API that `@tuwaio/quasar-sdk` calls: syncing Pulsar transactions (EVM and
    Solana), which Quasar then tracks on the server, and reading their history; and, for a Payments app, invoices,
    refunds and subscriptions paid in crypto straight to your wallets, with the checkout that the buyer's browser calls
    with a checkout token. Quasar Cloud serves it at `https://api.tuwa.io`; a self-hosted Quasar server serves the same
    endpoints at its own URL (Payments where it runs with `PAYMENTS_ENABLED=true`)."
  contact:
    name: TUWA Team
    url: https://github.com/TuwaIO
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://api.tuwa.io
    description: Quasar Cloud
tags:
  - name: Pulsar
    description: Transaction sync and history.
  - name: Invoices
    description: "Invoices of a Payments app: issue, read, cancel, release, correct, documents, quotes and methods."
  - name: Refunds
    description: Refunds sent from your wallet, verified by Quasar, with credit notes.
  - name: Subscriptions
    description: Plans billed every period as one invoice.
  - name: Checkout
    description: The buyer's browser, with the checkout token of an invoice (no key).
  - name: Webhooks
    description: Payment events (`payments.v1`) sent to your endpoints.
  - name: Monitoring
    description: Health of the API.
components:
  securitySchemes:
    SecretKey:
      type: apiKey
      in: header
      name: x-tuwa-secret-key
      description: Secret key of the Quasar app (`sk_live_...` for a live app, `sk_test_...` for a test app). Send it from
        your server only.
  schemas:
    PaymentWebhookEvent:
      type: object
      properties:
        id:
          type: string
          description: "The ledger event: the same for every delivery; deduplicate by it."
        object:
          type: string
          enum:
            - event
        apiVersion:
          type: string
          enum:
            - payments.v1
        type:
          type: string
          enum:
            - invoice.issued
            - invoice.processing
            - invoice.paid
            - invoice.underpaid
            - invoice.held
            - invoice.transfer_held
            - invoice.transfer_hold_voided
            - invoice.released
            - invoice.expired
            - invoice.cancelled
            - invoice.refunded
            - invoice.partially_refunded
            - invoice.replaced
            - refund.confirmed
            - refund.failed
            - payment.reverted
            - subscription.created
            - subscription.renewed
            - subscription.past_due
            - subscription.paused
            - subscription.resumed
            - subscription.cancel_scheduled
            - subscription.cancel_unscheduled
            - subscription.canceled
            - subscription.ended
            - subscription.permission_granted
            - subscription.charge_failed
            - subscription.permission_revoked
        createdAt:
          type: string
        sentAt:
          type: string
          description: When this delivery was sent; signed with the body.
        environment:
          $ref: "#/components/schemas/PaymentsEnvironment"
        data:
          type: object
          properties:
            invoice:
              $ref: "#/components/schemas/Invoice"
            settlement:
              type: object
              properties:
                methodId:
                  type:
                    - string
                    - "null"
                  description: "The payment method paid with (`GET /methods`): its token and network read `amountPaid`."
                chainId:
                  type:
                    - string
                    - "null"
                txHash:
                  type: string
                  description: The last transfer; `payments` of the invoice names them all.
                blockRef:
                  type:
                    - string
                    - "null"
                  description: Block or slot of the last transfer.
                amountPaid:
                  type:
                    - string
                    - "null"
                  description: What arrived in all, in base units.
                originWallet:
                  type:
                    - string
                    - "null"
                paidAt:
                  type:
                    - string
                    - "null"
                overpaid:
                  type: string
              required:
                - methodId
                - chainId
                - txHash
                - blockRef
                - amountPaid
                - originWallet
                - paidAt
                - overpaid
            payments:
              type: array
              items:
                $ref: "#/components/schemas/InvoicePayment"
              description: Every transfer credited to the invoice so far, on `invoice.paid`, `invoice.underpaid`, `invoice.held` and
                `invoice.released`.
            refund:
              $ref: "#/components/schemas/Refund"
            aml:
              type: object
              properties:
                decision:
                  type: string
                  enum:
                    - block
                reasons:
                  type: array
                  items: {}
              required:
                - decision
                - reasons
            subscription:
              $ref: "#/components/schemas/Subscription"
            hold:
              type: object
              properties:
                reason:
                  type:
                    - string
                    - "null"
                  enum:
                    - late
                    - aml
                    - quote_expired
                    - null
                txHash:
                  type:
                    - string
                    - "null"
                senders:
                  type: array
                  items:
                    type: string
                late:
                  type: boolean
                  enum:
                    - true
              required:
                - reason
                - txHash
              description: "`invoice.held`: why (`reason`), its transaction, the senders, `late`."
            heldTransfer:
              anyOf:
                - type: object
                  properties:
                    id:
                      type:
                        - string
                        - "null"
                    txHash:
                      type:
                        - string
                        - "null"
                    amount:
                      type:
                        - string
                        - "null"
                    senders:
                      type: array
                      items:
                        type: string
                    reason:
                      type:
                        - string
                        - "null"
                      enum:
                        - payer_mismatch
                        - payer_unconfirmed
                        - already_paid
                        - quote_changed
                        - null
                    late:
                      type: boolean
                      enum:
                        - true
                    screening:
                      type: object
                      properties:
                        status:
                          type: string
                          enum:
                            - blocked
                        reasons:
                          type: array
                          items: {}
                      required:
                        - status
                        - reasons
                  required:
                    - id
                    - txHash
                    - amount
                    - senders
                    - reason
                - type: object
                  properties:
                    id:
                      type:
                        - string
                        - "null"
                    voided:
                      type: boolean
                      enum:
                        - true
                    txHash:
                      type:
                        - string
                        - "null"
                    paidInvoice:
                      type:
                        - string
                        - "null"
                  required:
                    - id
                    - voided
                    - txHash
                    - paidInvoice
              description: "`invoice.transfer_held`: a transfer that reached the invoice without being tied to it by proof, recorded
                as a held transfer (`id`) to refund to its sender; the invoice stays as it was.
                `invoice.transfer_hold_voided`: the same transaction was proven to pay another invoice of yours
                (`paidInvoice`), nothing to refund."
      required:
        - id
        - object
        - apiVersion
        - type
        - createdAt
        - sentAt
        - environment
        - data
    PaymentsEnvironment:
      type: string
      enum:
        - live
        - test
      description: "Live or test: the key that issued it decides. Test invoices are paid on test networks."
    Invoice:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          enum:
            - invoice
        number:
          type:
            - string
            - "null"
          description: Series number; `TEST-` for test invoices.
        status:
          $ref: "#/components/schemas/InvoiceStatus"
        environment:
          allOf:
            - $ref: "#/components/schemas/PaymentsEnvironment"
            - type:
                - string
                - "null"
        currency:
          $ref: "#/components/schemas/PaymentsCurrency"
        locale:
          $ref: "#/components/schemas/InvoiceLocale"
        issuedAt:
          type:
            - string
            - "null"
          format: date-time
          description: When it was issued.
        supplyDate:
          type:
            - string
            - "null"
          format: date-time
          description: Date of supply (BT-72).
        dueAt:
          type:
            - string
            - "null"
          format: date-time
          description: "When it stops being payable. A payment Quasar learned of before it (handed over to `/submit` or `/relay`,
            or a Solana Pay transfer in a block before it: an invoice quoted in a Solana method stays open until Quasar
            has read its Solana Pay reference at least 30 seconds past `dueAt`) may still confirm for up to 30 minutes
            after it: the invoice stays payable meanwhile, so `expired` and the `invoice.expired` webhook can come up to
            30 minutes after `dueAt`. Confirmed in time, it pays the invoice as usual, except in an asset not pegged to
            the invoice currency when its block is more than 60 seconds past the end of the locked quote (`held`,
            `quote_expired`). A payment handed over after `dueAt`, or one that confirms after the invoice expired
            (Quasar reads a payment whose tracker lost sight of it again for 24 hours), is held as late, with its AML
            screening."
        seller:
          $ref: "#/components/schemas/InvoiceSeller"
        buyer:
          allOf:
            - $ref: "#/components/schemas/Buyer"
            - type:
                - object
                - "null"
              properties:
                companyInvoice:
                  type: boolean
          description: The buyer (EN 16931 BT-44 to BT-55). An e-invoice is issued only when the fields it needs are there;
            otherwise the invoice is a plain PDF and `eInvoiceSkipped` names what was missing.
        expectedPayer:
          type:
            - string
            - "null"
        buyerReference:
          type:
            - string
            - "null"
        orderReference:
          type:
            - string
            - "null"
        lineItems:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              quantity:
                type: string
              unitPrice:
                type: string
              taxCategory:
                $ref: "#/components/schemas/TaxCategory"
              taxRate:
                type: string
              net:
                type: string
              unitCode:
                type: string
            required:
              - name
              - quantity
              - unitPrice
              - taxCategory
              - taxRate
              - net
        pricesIncludeTax:
          type:
            - boolean
            - "null"
        subtotal:
          type: string
          description: Total without VAT.
          example: "49.00"
        taxTotal:
          type: string
          description: VAT.
          example: "49.00"
        rounding:
          type: string
          description: Rounding.
          example: "49.00"
        total:
          type: string
          description: Total to pay.
          example: "49.00"
        taxBreakdown:
          type: array
          items:
            type: object
            properties:
              taxCategory:
                $ref: "#/components/schemas/TaxCategory"
              taxRate:
                type: string
              taxable:
                type: string
              tax:
                type: string
            required:
              - taxCategory
              - taxRate
              - taxable
              - tax
        notes:
          type:
            - string
            - "null"
        reverseCharge:
          type:
            - boolean
            - "null"
        taxExemptionReason:
          type:
            - string
            - "null"
        metadata:
          type:
            - object
            - "null"
          additionalProperties: {}
        successUrl:
          type:
            - string
            - "null"
        cancelUrl:
          type:
            - string
            - "null"
        checkoutToken:
          type:
            - string
            - "null"
          description: The checkout token while the invoice can be paid (`open`, `processing`, `underpaid`).
        payUrl:
          type:
            - string
            - "null"
          description: "The payment page while it can be paid: the link its emails carry."
        quote:
          type:
            - object
            - "null"
          properties:
            methodId:
              type:
                - string
                - "null"
            payer:
              type: string
            cryptoAmountExpected:
              type:
                - string
                - "null"
            amountDue:
              type:
                - string
                - "null"
              description: "What must still arrive while the invoice takes a payment: the whole price, or the rest of an `underpaid`
                invoice. `null` otherwise."
            amountToSend:
              type:
                - string
                - "null"
              description: "What the buyer sends: what must still arrive (the whole price, or the rest of an `underpaid` invoice),
                grossed up for a transfer fee."
            lockedAt:
              type:
                - string
                - "null"
            expiresAt:
              type:
                - string
                - "null"
            rate: {}
            reference:
              type:
                - string
                - "null"
          required:
            - methodId
            - payer
            - cryptoAmountExpected
            - amountDue
            - amountToSend
            - lockedAt
            - expiresAt
            - reference
          description: The locked quote, once a buyer chose how to pay. Token amounts in base units.
        settlement:
          type:
            - object
            - "null"
          properties:
            methodId:
              type:
                - string
                - "null"
              description: "The payment method paid with (`GET /methods`): its token and network read `amountPaid`."
            chainId:
              type:
                - string
                - "null"
            txHash:
              type: string
              description: The last transfer; `payments` of the invoice names them all.
            blockRef:
              type:
                - string
                - "null"
              description: Block or slot of the last transfer.
            amountPaid:
              type:
                - string
                - "null"
              description: What arrived in all, in base units.
            originWallet:
              type:
                - string
                - "null"
            paidAt:
              type:
                - string
                - "null"
            overpaid:
              type: string
          required:
            - methodId
            - chainId
            - txHash
            - blockRef
            - amountPaid
            - originWallet
            - paidAt
            - overpaid
          description: The payment, once there is one.
        reviewReason:
          type:
            - string
            - "null"
          description: "Why the payment waits for you: `overpaid` when the app flags overpayments, `quote_expired` when it arrived
            after its locked quote expired (in an asset not pegged to the invoice currency, a block more than 60 seconds
            past the end of the quote). A transfer Quasar could tie to no invoice never holds the invoice: it is a held
            transfer of its own (`/held-transfers`). A payment held because it came late (handed over after `dueAt`, or
            arrived after the invoice expired or was cancelled) has no reason here: the ledger marks it `late` (screened
            like any payment: a sender the screening blocks waits as an AML hold)."
        aml:
          type:
            - object
            - "null"
          properties:
            status:
              type: string
            reasons:
              type: array
              items:
                type: string
            coverage:
              type:
                - string
                - "null"
          required:
            - status
            - reasons
            - coverage
        receiptNumber:
          type:
            - string
            - "null"
        eInvoiceSkipped:
          type:
            - array
            - "null"
          items:
            type: string
          description: What the e-invoice lacked when the invoice was issued as a plain PDF, for example `buyer.country`.
        refundedTotal:
          type: string
          description: Refunded so far.
          example: "49.00"
        replaces:
          type:
            - string
            - "null"
        replacedBy:
          type:
            - string
            - "null"
        subscriptionId:
          type:
            - string
            - "null"
        period:
          type:
            - number
            - "null"
        createdAt:
          type: string
          format: date-time
          description: When it was created.
        updatedAt:
          type: string
          format: date-time
          description: When it last changed.
      required:
        - id
        - object
        - number
        - status
        - environment
        - currency
        - locale
        - issuedAt
        - supplyDate
        - dueAt
        - seller
        - buyer
        - expectedPayer
        - buyerReference
        - orderReference
        - lineItems
        - pricesIncludeTax
        - subtotal
        - taxTotal
        - rounding
        - total
        - taxBreakdown
        - notes
        - reverseCharge
        - taxExemptionReason
        - metadata
        - successUrl
        - cancelUrl
        - checkoutToken
        - payUrl
        - quote
        - settlement
        - reviewReason
        - aml
        - receiptNumber
        - eInvoiceSkipped
        - refundedTotal
        - replaces
        - replacedBy
        - subscriptionId
        - period
        - createdAt
        - updatedAt
      description: An invoice. Fiat amounts are decimal strings in the invoice currency; token amounts are in base units.
    InvoiceStatus:
      type: string
      enum:
        - open
        - processing
        - paid
        - underpaid
        - held
        - partially_refunded
        - refunded
        - expired
        - cancelled
      description: "`open` until paid; `processing` while a payment is confirmed; `paid`, `underpaid` (the buyer may top it
        up), `held` (released or refunded by the merchant), `partially_refunded`, `refunded`; `expired` or `cancelled`
        without a payment (`expired` up to 30 minutes after `dueAt` while a payment sent before it confirms; a payment
        that still arrives later makes it `held`, `late`)."
    PaymentsCurrency:
      type: string
      enum:
        - USD
        - EUR
      description: Fiat currency.
    InvoiceLocale:
      type:
        - string
        - "null"
      enum:
        - en
        - uk
        - zh-CN
        - es
        - it
        - de
        - null
      description: Language of the invoice, its documents and emails.
    InvoiceSeller:
      type:
        - object
        - "null"
      properties:
        legalName:
          type:
            - string
            - "null"
        tradingName:
          type:
            - string
            - "null"
        address:
          type:
            - string
            - "null"
          description: The postal address as one text, as the checkout shows it.
        addressLine1:
          type:
            - string
            - "null"
        addressLine2:
          type:
            - string
            - "null"
        postalCode:
          type:
            - string
            - "null"
        city:
          type:
            - string
            - "null"
        country:
          type:
            - string
            - "null"
          description: ISO 3166-1 alpha-2.
        registrationNumber:
          type:
            - string
            - "null"
        taxId:
          type:
            - string
            - "null"
        supportEmail:
          type:
            - string
            - "null"
        website:
          type:
            - string
            - "null"
      description: The seller as printed, from the app's payment settings when the invoice was issued. Invoices issued before
        the address had its parts carry only `address`.
    Buyer:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          description: Quasar Cloud sends the invoice, receipt and credit notes to it.
        addressLine1:
          type: string
        addressLine2:
          type: string
        postalCode:
          type: string
        city:
          type: string
        region:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2, for example `DE`.
        registrationNumber:
          type: string
        taxId:
          type: string
          description: Needed for a reverse-charge invoice.
        externalId:
          type: string
          description: Your ID of the buyer; filter invoices by it.
      description: The buyer (EN 16931 BT-44 to BT-55). An e-invoice is issued only when the fields it needs are there;
        otherwise the invoice is a plain PDF and `eInvoiceSkipped` names what was missing.
    TaxCategory:
      type: string
      enum:
        - S
        - Z
        - E
        - AE
        - K
        - G
        - O
      description: "VAT category (EN 16931 UNCL5305): `S` standard, `Z` zero rated, `E` exempt (needs `taxExemptionReason`),
        `AE` reverse charge, `K` intra-community, `G` export, `O` outside the scope of VAT."
    InvoicePayment:
      type: object
      properties:
        txHash:
          type: string
        chainId:
          type:
            - string
            - "null"
        amount:
          type: string
          description: What it credited, in base units of the token of `methodId`.
        methodId:
          type:
            - string
            - "null"
          description: The payment method paid with (`GET /methods`).
        senders:
          type: array
          items:
            type: string
        blockRef:
          type:
            - string
            - "null"
        at:
          type: string
          description: When it was mined, or when it was verified if the network named no time.
      required:
        - txHash
        - chainId
        - amount
        - methodId
        - senders
        - blockRef
        - at
      description: A transfer credited to an invoice.
    Refund:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          enum:
            - refund
        invoiceId:
          type: string
        status:
          type: string
          enum:
            - requested
            - submitted
            - confirmed
            - failed
        amount:
          type: string
        currency:
          type: string
        mode:
          type: string
          enum:
            - fiat_value
            - exact_received
        cryptoAmount:
          type: string
        assetId:
          type: string
        chainId:
          type: string
        to:
          type: string
          description: "The payer: refunds go back to the address that paid."
        txHash:
          type:
            - string
            - "null"
        from:
          type:
            - string
            - "null"
        reason:
          type:
            - string
            - "null"
        failureReason:
          type:
            - string
            - "null"
        creditNoteNumber:
          type:
            - string
            - "null"
        heldTransfer:
          type:
            - string
            - "null"
          description: The held transfer it returns to its sender, or `null` for a refund of the invoice.
        createdAt:
          type: string
        confirmedAt:
          type:
            - string
            - "null"
      required:
        - id
        - object
        - invoiceId
        - status
        - amount
        - currency
        - mode
        - cryptoAmount
        - assetId
        - chainId
        - to
        - txHash
        - from
        - reason
        - failureReason
        - creditNoteNumber
        - heldTransfer
        - createdAt
        - confirmedAt
    Subscription:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          enum:
            - subscription
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        environment:
          $ref: "#/components/schemas/PaymentsEnvironment"
        buyer:
          allOf:
            - $ref: "#/components/schemas/Buyer"
            - type:
                - object
                - "null"
        expectedPayer:
          type:
            - string
            - "null"
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLineInput"
        currency:
          $ref: "#/components/schemas/PaymentsCurrency"
        interval:
          type: string
          enum:
            - day
            - week
            - month
            - year
        intervalCount:
          type: number
        trialDays:
          type: number
        collection:
          type: string
          enum:
            - send_invoice
            - auto_charge
        preferredMethodId:
          type:
            - string
            - "null"
        permission:
          type:
            - object
            - "null"
          properties:
            status:
              type: string
              enum:
                - active
                - revoked
                - expired
            chainId:
              type:
                - string
                - "null"
            methodId:
              type:
                - string
                - "null"
            payer:
              type:
                - string
                - "null"
            tokenAddress:
              type:
                - string
                - "null"
            periodAmount:
              type:
                - string
                - "null"
            periodSeconds:
              type: number
            startsAt:
              type:
                - string
                - "null"
            expiresAt:
              type:
                - string
                - "null"
            grantedAt:
              type:
                - string
                - "null"
            revokedAt:
              type:
                - string
                - "null"
          required:
            - status
            - chainId
            - methodId
            - payer
            - tokenAddress
            - periodAmount
            - periodSeconds
            - startsAt
            - expiresAt
            - grantedAt
            - revokedAt
          description: The ERC-7715 permission of `auto_charge`, without its context.
        graceDays:
          type: number
        currentPeriod:
          type: number
        currentPeriodStart:
          type:
            - string
            - "null"
        currentPeriodEnd:
          type:
            - string
            - "null"
        cycles:
          type:
            - number
            - "null"
        endsAt:
          type:
            - string
            - "null"
        cancelAtPeriodEnd:
          type: boolean
        canceledAt:
          type:
            - string
            - "null"
        cancellationReason:
          type:
            - string
            - "null"
        pausedAt:
          type:
            - string
            - "null"
        endedAt:
          type:
            - string
            - "null"
        metadata:
          type:
            - object
            - "null"
          additionalProperties: {}
        createdAt:
          type: string
      required:
        - id
        - object
        - status
        - environment
        - buyer
        - expectedPayer
        - lineItems
        - currency
        - interval
        - intervalCount
        - trialDays
        - collection
        - preferredMethodId
        - permission
        - graceDays
        - currentPeriod
        - currentPeriodStart
        - currentPeriodEnd
        - cycles
        - endsAt
        - cancelAtPeriodEnd
        - canceledAt
        - cancellationReason
        - pausedAt
        - endedAt
        - metadata
        - createdAt
      description: "A subscription: each period is one invoice."
    SubscriptionStatus:
      type: string
      enum:
        - trialing
        - incomplete
        - active
        - past_due
        - paused
        - canceled
        - ended
    InvoiceLineInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        quantity:
          type: string
          description: Defaults to `1`.
        unitPrice:
          type: string
          description: Price of one unit in the invoice currency.
          example: "49.00"
        taxCategory:
          $ref: "#/components/schemas/TaxCategory"
        taxRate:
          type: string
          description: VAT rate in percent, for example `21`.
        unitCode:
          type: string
          description: UN/ECE Recommendation 20 unit code (`C62`, `HUR`).
      required:
        - name
        - unitPrice
    Transaction:
      oneOf:
        - $ref: "#/components/schemas/EvmTransaction"
        - $ref: "#/components/schemas/SolanaTransaction"
        - $ref: "#/components/schemas/StarknetTransaction"
      discriminator:
        propertyName: adapter
        mapping:
          evm: "#/components/schemas/EvmTransaction"
          solana: "#/components/schemas/SolanaTransaction"
          starknet: "#/components/schemas/StarknetTransaction"
      description: A blockchain transaction tracked by Pulsar. Discriminated by `adapter` field.
    EvmTransaction:
      type: object
      properties:
        appName:
          type: string
        chainId:
          anyOf:
            - type: number
            - type: string
          description: EVM chain ID (1), or for Solana the CAIP-2 chain ID with the genesis hash
            ("solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp", Pulsar 0.9 and later); transactions synced by older Pulsar
            versions carry "solana:mainnet".
        description:
          anyOf:
            - type: string
            - type: array
              prefixItems:
                - type: string
                - type: string
                - type: string
                - type: string
          description: User-facing description. Single string or [pending, success, error, replaced].
        error:
          $ref: "#/components/schemas/TuwaErrorState"
        finishedTimestamp:
          type: number
          description: On-chain timestamp (seconds) when finalized.
        from:
          type: string
          description: Sender's wallet address.
        isError:
          type: boolean
          description: Whether the transaction is in a failed state.
        isTrackedModalOpen:
          type: boolean
        localTimestamp:
          type: number
          description: Local timestamp (seconds) when initiated by user.
        payload:
          type: object
          additionalProperties:
            anyOf:
              - type: string
              - type: number
          description: Arbitrary custom data associated with the transaction.
        pending:
          type: boolean
          description: Whether the transaction is awaiting on-chain confirmation.
        status:
          $ref: "#/components/schemas/TransactionStatus"
        title:
          anyOf:
            - type: string
            - type: array
              prefixItems:
                - type: string
                - type: string
                - type: string
                - type: string
          description: User-facing title. Single string or [pending, success, error, replaced].
        tracker:
          $ref: "#/components/schemas/TransactionTracker"
        txKey:
          type: string
          description: Unique key of the transaction, set by Pulsar (for example the transaction hash).
        type:
          type: string
          description: Application-specific transaction category (e.g. "SWAP", "APPROVE").
        connectorType:
          type: string
          description: Connector type of the wallet, e.g. "evm:metamask".
        requiredConfirmations:
          type: number
          description: Number of confirmations required.
        confirmations:
          anyOf:
            - type: number
            - type: string
            - type: "null"
          description: Number of confirmations or finality status.
        rpcUrl:
          type: string
          description: RPC URL used for submission.
        syncStatus:
          type: string
          enum:
            - synced
            - pending-sync
          description: Status of cloud synchronization.
        adapter:
          type: string
          enum:
            - evm
        hash:
          type: string
          pattern: ^0x[a-fA-F0-9]*$
          description: On-chain transaction hash (0x-prefixed).
        input:
          type: string
          pattern: ^0x[a-fA-F0-9]*$
          description: Contract interaction data payload (0x-prefixed).
        maxFeePerGas:
          type: string
          description: EIP-1559 max fee per gas (wei).
        maxPriorityFeePerGas:
          type: string
          description: EIP-1559 max priority fee per gas (wei).
        nonce:
          type: number
          description: Transaction nonce.
        replacedTxHash:
          type: string
          pattern: ^0x[a-fA-F0-9]*$
          description: Hash of the transaction this one replaced.
        to:
          type: string
          pattern: ^0x[a-fA-F0-9]*$
          description: Recipient's address or contract address.
        value:
          type: string
          description: Native currency amount in wei.
        bundlerUrl:
          type: string
          description: Custom bundler RPC URL for ERC-4337 UserOperation tracking.
        pimlicoApiKey:
          type: string
          description: Pimlico API key for ERC-4337 UserOperation tracking.
      required:
        - chainId
        - from
        - localTimestamp
        - pending
        - tracker
        - txKey
        - type
        - connectorType
        - adapter
    TuwaErrorState:
      type: object
      properties:
        message:
          type: string
        raw:
          type: object
          additionalProperties: {}
