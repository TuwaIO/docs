  /v1/payments/checkout/{token}/paymaster:
    post:
      tags:
        - Checkout
      summary: ERC-7677 paymaster
      description: "JSON-RPC `pm_getPaymasterStubData` and `pm_getPaymasterData` for the buyer's smart wallet, sponsored when
        the user operation is exactly the quoted transfer. Any origin may call it (the wallet calls from its own site).
        No key: the token opens this invoice only; a browser may call from the app's domains (any, when it lists none)."
      parameters:
        - schema:
            type: string
            description: The checkout token of the invoice.
          required: true
          description: The checkout token of the invoice.
          name: token
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  enum:
                    - "2.0"
                id: {}
                method:
                  type: string
                params:
                  type: array
                  items: {}
              required:
                - jsonrpc
                - method
                - params
      responses:
        "200":
          description: The JSON-RPC answer.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        "403":
          description: "`origin_not_allowed`, `payments_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "404":
          description: "`checkout_not_found`: a wrong or replaced token."
          content:
            application/json:
