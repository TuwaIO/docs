    CreateTransactionRequest:
      oneOf:
        - $ref: "#/components/schemas/EvmTransaction"
        - $ref: "#/components/schemas/SolanaTransaction"
        - $ref: "#/components/schemas/StarknetTransaction"
      discriminator:
        propertyName: adapter
        mapping:
          evm: "#/components/schemas/EvmTransaction"
          solana: "#/components/schemas/SolanaTransaction"
          starknet: "#/components/schemas/StarknetTransaction"
      description: Request body for syncing a new pending transaction to the cloud.
    SuccessCreateResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        txKey:
          type: string
          description: Key of the synced transaction.
        mode:
          type: string
          enum:
            - fast
            - lazy
          description: "`fast`: tracking starts right away. `lazy`: queued, because the quota of the organization is used up."
        duplicate:
          type: boolean
          enum:
            - true
          description: Quasar already had this `txKey`; no new record.
      required:
        - success
        - txKey
        - mode
    BatchHashRequest:
      type: object
      properties:
        hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          description: Hash of the transaction that executed the batch.
          example: "0xabababababababababababababababababababababababababababababababab"
      required:
        - hash
    BatchHashResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        txKey:
          type: string
          description: The batch ID.
        hash:
          type: string
          description: The hash Quasar tracks the batch by.
        duplicate:
          type: boolean
          enum:
            - true
          description: Quasar already had this hash.
      required:
        - success
        - txKey
        - hash
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: string
          description: "`operational`, or `degraded_replica` when the read replica is down."
        database:
          type: string
        readReplica:
          type: string
        redis:
          type: string
        workers:
          type: string
        workerBacklog:
          type: number
        latency:
          type: string
        timestamp:
          type: string
      required:
        - success
        - status
        - database
        - readReplica
        - redis
        - workers
        - workerBacklog
        - latency
        - timestamp
    PaginatedHistoryResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Always `true` in a 200 answer.
        docs:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
          description: Array of transaction documents for the current page.
        totalDocs:
          type: number
          description: Total matching documents across all pages.
        totalPages:
          type: number
          description: Total number of pages.
        page:
          type: number
          description: Current page number (1-indexed).
        hasNextPage:
          type: boolean
          description: Whether a next page exists.
        hasPrevPage:
          type: boolean
          description: Whether a previous page exists.
      required:
        - success
        - docs
        - totalDocs
        - totalPages
        - page
        - hasNextPage
        - hasPrevPage
      description: Paginated response containing transaction history.
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message.
        message:
          type: string
          description: Error message (NestJS errors).
        statusCode:
          type: integer
          description: The HTTP status (NestJS errors).
        code:
          type: string
          description: A stable code where a client acts on it, such as `data_processing_required`.
    PaymentsError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable code, for example `invoice_not_found`.
            message:
              type: string
            issues:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
                required:
                  - path
                  - message
              description: The fields at fault of an `invalid_request`, for example `buyer.country`.
          required:
            - code
            - message
          additionalProperties: {}
      required:
        - error
      description: "A refused Payments call: `{ error: { code, message, issues?, … } }` with its HTTP status."
    KeyRefusal:
      type: object
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
      required:
        - statusCode
        - error
        - message
      description: "A refusal of the key or the app before the Payments API answers: `401` for a missing or unknown key; `403`
        for a public key on a write, a disabled app, an app being deleted, or an IP address or origin the app does not
        allow."
    InvoiceWithCheckout:
      type: object
      properties:
        invoice:
          $ref: "#/components/schemas/Invoice"
        checkoutToken:
          type:
            - string
            - "null"
        payUrl:
          type:
            - string
            - "null"
      required:
        - invoice
        - checkoutToken
        - payUrl
    CreateInvoiceRequest:
      type: object
      properties:
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLineInput"
          description: The lines, 1 to 100; or give `amount`.
        amount:
          type: string
          description: A total as one line; or give `lineItems`.
          example: "49.00"
        description:
          type: string
          description: Name of the `amount` line.
        currency:
          $ref: "#/components/schemas/PaymentsCurrency"
        locale:
          $ref: "#/components/schemas/InvoiceLocale"
        buyer:
          $ref: "#/components/schemas/Buyer"
        expectedPayer:
          type: string
          description: CAIP-10 account you expect to pay.
        buyerReference:
          type: string
          description: BT-10.
        orderReference:
          type: string
          description: BT-13.
        metadata:
          type: object
          additionalProperties: {}
          description: Your data, at most 8 KiB as JSON.
        successUrl:
          type: string
        cancelUrl:
          type: string
        notes:
          type: string
        pricesIncludeTax:
          type: boolean
        reverseCharge:
          type: boolean
        taxExemptionReason:
          type: string
        dueAt:
          type: string
          format: date-time
          description: When it stops being payable; or give `expiresInMinutes`. A payment sent before it may still confirm for up
            to 30 minutes after it.
        expiresInMinutes:
          type: integer
          description: From 5 minutes to 90 days.
        supplyDate:
          type: string
          format: date-time
          description: Date of supply. Defaults to the issue date.
    InvoiceList:
      type: object
      properties:
        object:
          type: string
          enum:
            - list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        nextCursor:
          type:
            - string
            - "null"
      required:
        - object
        - data
        - nextCursor
      description: A page, newest first; pass `nextCursor` as `cursor` for the next.
    InvoiceDetails:
      allOf:
        - $ref: "#/components/schemas/Invoice"
        - type: object
          properties:
            refunds:
              type: array
              items:
                $ref: "#/components/schemas/Refund"
              description: Its five newest refunds and every refund still under way, newest first.
            refundsTotal:
              type: integer
              description: How many refunds it has.
            creditNotesTotal:
              type: integer
              description: How many credit notes it has (one per refund and correction).
            payments:
              type: array
              items:
                $ref: "#/components/schemas/InvoicePayment"
              description: "Every transfer credited to it, oldest first, also through a correction: an invoice paid in parts has
                several."
            attempts:
              type: array
              items:
                $ref: "#/components/schemas/InvoiceAttempt"
              description: The ten newest transactions that did not pay it, newest first; the ledger has them all.
            attemptsTotal:
              type: integer
              description: How many transactions did not pay it.
            walletConfirmations:
              type: array
              items:
                $ref: "#/components/schemas/InvoiceWalletConfirmation"
              description: What the wallets that confirmed it signed, oldest first.
          required:
            - refunds
            - refundsTotal
            - creditNotesTotal
            - payments
            - attempts
            - attemptsTotal
            - walletConfirmations
      description: An invoice. Fiat amounts are decimal strings in the invoice currency; token amounts are in base units.
    InvoiceAttempt:
      type: object
      properties:
        txHash:
          type:
            - string
            - "null"
        chainId:
          type:
            - string
            - "null"
        reason:
          type: string
          description: Why it did not pay the invoice, such as `reverted`, `no_matching_transfer` or `payer_mismatch`.
        amount:
          type:
            - string
            - "null"
          description: "What it carried to you without paying anything, when it did: base units of the invoice's token."
        senders:
          type: array
          items:
            type: string
        heldTransfer:
          type:
            - string
            - "null"
          description: The held transfer it became, for a refund to its sender (`GET /invoices/:id/held-transfers`).
        at:
          type: string
      required:
        - txHash
        - chainId
        - reason
        - amount
        - senders
        - heldTransfer
        - at
      description: A transaction that was tied to an invoice and did not pay it.
    InvoiceWalletConfirmation:
      type: object
      properties:
        account:
          type: string
          description: The wallet, as a CAIP-10 account on the network it signed on.
        kind:
          type: string
          description: "`eoa`, `eip1271` and `eip6492` signed an EIP-4361 message; `authorization` signed the EIP-3009
            authorization of a relayed payment."
        chainId:
          type: string
        signature:
          type:
            - string
            - "null"
        message:
          type:
            - string
            - "null"
          description: The EIP-4361 message it signed; `null` for an authorization.
        domain:
          type:
            - string
            - "null"
        nonce:
          type:
            - string
            - "null"
        at:
          type: string
      required:
        - account
        - kind
        - chainId
        - signature
        - message
        - domain
        - nonce
        - at
      description: "What a wallet signed to confirm an invoice. A wallet that confirms may still not be the one that pays:
        `senders` of `payments` names who did."
    InvoiceCorrection:
      allOf:
        - $ref: "#/components/schemas/InvoiceWithCheckout"
        - type: object
          properties:
            replaced:
              $ref: "#/components/schemas/Invoice"
          required:
            - replaced
    InvoiceLedger:
      type: object
      properties:
        object:
          type: string
          enum:
            - list
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              seq:
                type: number
              type:
                type: string
              data: {}
              actor:
                type: string
              chainId:
                type:
                  - string
                  - "null"
              txHash:
                type:
                  - string
                  - "null"
              createdAt:
                type: string
              prevHash:
                type:
                  - string
                  - "null"
              hash:
                type: string
            required:
              - id
              - seq
              - type
              - actor
              - chainId
              - txHash
              - createdAt
              - prevHash
              - hash
        total:
          type: integer
          description: How many steps the whole ledger has.
        nextCursor:
          type:
            - string
            - "null"
          description: Pass it as `cursor` for the next page.
        summary:
          type: object
          properties:
            createdBy:
              type:
                - string
                - "null"
            stepTimes:
              type: object
              properties:
                quoted:
                  type:
                    - string
                    - "null"
                receipt:
                  type:
                    - string
                    - "null"
              required:
                - quoted
                - receipt
          required:
