              type:
                - string
                - "null"
            status:
              $ref: "#/components/schemas/InvoiceStatus"
            environment:
              allOf:
                - $ref: "#/components/schemas/PaymentsEnvironment"
                - type:
                    - string
                    - "null"
            currency:
              $ref: "#/components/schemas/PaymentsCurrency"
            total:
              anyOf:
                - type: string
                - type: number
            totalMinor:
              type:
                - string
                - "null"
            lineItems:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
