                    type: string
                  quantity:
                    type: string
                  unitPrice:
                    type: string
                  taxCategory:
                    $ref: "#/components/schemas/TaxCategory"
                  taxRate:
                    type: string
                  netMinor:
                    type: string
                required:
                  - name
                  - quantity
                  - unitPrice
                  - taxCategory
                  - taxRate
                  - netMinor
            locale:
              $ref: "#/components/schemas/InvoiceLocale"
            dueAt:
              type:
                - string
                - "null"
              description: "When it stops being payable. A payment Quasar learned of before it (handed over to `/submit` or `/relay`,
                or a Solana Pay transfer in a block before it: an invoice quoted in a Solana method stays open until
                Quasar has read its Solana Pay reference at least 30 seconds past `dueAt`) may still confirm for up to
                30 minutes after it: the invoice stays payable meanwhile, so `expired` and the `invoice.expired` webhook
                can come up to 30 minutes after `dueAt`. Confirmed in time, it pays the invoice as usual, except in an
                asset not pegged to the invoice currency when its block is more than 60 seconds past the end of the
                locked quote (`held`, `quote_expired`). A payment handed over after `dueAt`, or one that confirms after
                the invoice expired (Quasar reads a payment whose tracker lost sight of it again for 24 hours), is held
                as late, with its AML screening."
            successUrl:
              type:
                - string
                - "null"
            cancelUrl:
              type:
                - string
                - "null"
            amountPaid:
              type:
                - string
                - "null"
              description: Base units of the quoted asset received so far.
            restPayable:
              type: boolean
              description: "Whether the rest of an underpaid invoice can be quoted now: its method is on, something is left and it is
                not past the due date."
            originWallet:
              type:
                - string
                - "null"
              description: The wallet that paid an underpaid invoice first, the only one that pays the rest.
            review:
              type:
                - object
                - "null"
              properties:
                reason:
                  type: string
                  enum:
                    - screening
                    - late
                    - overpaid
                    - quote_expired
              required:
                - reason
              description: "Why a payment waits for, or was flagged to, the seller. `screening`: the sender did not pass the AML check
                (also a late one). A transfer Quasar could tie to no invoice never holds the invoice: it is a rejected
                payment with `held`, which the seller returns to the wallet that sent it."
            refundedTotalMinor:
              type:
                - string
                - "null"
              description: Refunded, in minor units (cents).
            pendingPayments:
              type: number
              description: "Payments of the invoice handed over and still on their way, whoever handed them over: tracked transactions
                not yet verified or rejected (recorded within the last 25 minutes), gasless relays still sending (within
                35 minutes), and claims of this invoice on a transaction another invoice handed over first that Quasar
                has not decided yet (made within 25 minutes). A page that finds one on its way should not offer to pay."
            rejectedTxKeys:
              type: array
              items:
                type: string
              description: "Every key a failed payment may be known by, latest first: the `txKey` of a rejected transaction, the hash
                the checkout handed over when a sped-up transaction replaced it, the `userOpHash` of a gasless relay.
                Read `rejectedPayments` for why."
            rejectedPayments:
              type: array
              items:
                $ref: "#/components/schemas/CheckoutRejectedPayment"
              description: "The payments that failed, latest first (at most 10). `final`: the transaction can never pay the invoice
                (`reverted`, `cancelled`, `expired` Solana blockhash, `no_matching_transfer`, `reference_missing`,
                `too_early`, `tx_already_used`, `payer_unconfirmed`, `chain_mismatch`, `no_quote`, `no_payment_method`,
                a relay the bundler refused or never sent, `unresolved_after_24h`), so the buyer may pay again;
                otherwise (`not_found`, `timeout`, `replaced`, `payer_mismatch`, `settlement_failed`…) the money may
                still be on its way or with the merchant: ask the buyer to check the wallet before paying again (for
                `settlement_failed`, confirmed on chain, to contact the merchant and not pay again). `movedMoney`: the
                transaction went through without paying the invoice, or Quasar has not recorded it yet, and may have
                moved money. `rechecked`: Quasar still reads the transaction again (a `not_found`, `timeout` or
                `replaced` rejection, for 24 hours after Quasar learned of the payment, while `unresolvedPayments`
                counts it: if it arrives, it is recorded, paid within the grace, else held as late; once Quasar reports
                `unresolvedPayments` 0, such a rejection was resolved; a `settlement_failed` one for 30 days). A
                transaction sped up in the wallet is followed under its new hash and not rejected; `original` is the
                hash the checkout handed over."
            paymentCountsUntil:
              type:
                - string
                - "null"
              description: "While the invoice is payable and a payment Quasar learned of before `dueAt` is on its way: until when the
                invoice waits for it (`dueAt` plus 30 minutes); `null` otherwise. Say from it, not from the browser
                clock, that the payment was sent in time."
            unresolvedPayments:
              type: number
              description: "Payments of the invoice that may still arrive: tracked transactions neither verified nor rejected for good
                (also one stuck past the 25 minutes `pendingPayments` counts, and one rejected with `not_found`,
                `timeout` or `replaced`), which Quasar reads again for 24 hours after it learned of them and then closes
                (`unresolved_after_24h`), gasless relays still sending, and claims of this invoice on a transaction
                another invoice handed over first that Quasar has not decided yet. While it is above 0, do not offer a
                plain second payment and never tell the buyer that nothing was charged."
            onTimeTxKeys:
              type: array
              items:
                type: string
              description: "Every key (`txKey`, hash, the hash a sped-up transaction replaced, the relay `userOpHash`) of the payments
                that count as sent in time: Quasar learned of them before `dueAt` (all of them without a `dueAt`); at
                most the latest 20 transactions and 10 relays. Match the page's own keys against it, not the browser
                clock."
            replacedBy:
              type:
                - object
                - "null"
              properties:
                number:
                  type:
                    - string
                    - "null"
                checkoutToken:
                  type:
                    - string
                    - "null"
              required:
                - number
                - checkoutToken
              description: The invoice that replaced this one after a correction; its checkout token while payable.
            subscription:
