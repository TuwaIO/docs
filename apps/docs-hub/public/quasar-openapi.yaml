    TransactionStatus:
      type: string
      enum:
        - Failed
        - Success
        - Replaced
      description: Terminal status of a processed transaction.
    TransactionTracker:
      type: string
      enum:
        - ethereum
        - safe
        - gelato
        - solana
        - erc4337
        - eip5792
      description: "The tracking strategy used for monitoring the transaction. `eip5792`: a batch of calls sent with
        `wallet_sendCalls`, synced by its batch ID and tracked on-chain once the app sends the hash of its transaction
        (`POST /v1/engine/pulsar/sync/{txKey}/hash`)."
    SolanaTransaction:
      type: object
      properties:
        appName:
          type: string
        chainId:
          anyOf:
            - type: number
            - type: string
          description: EVM chain ID (1), or for Solana the CAIP-2 chain ID with the genesis hash
            ("solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp", Pulsar 0.9 and later); transactions synced by older Pulsar
            versions carry "solana:mainnet".
        description:
          anyOf:
            - type: string
            - type: array
              prefixItems:
                - type: string
                - type: string
                - type: string
                - type: string
          description: User-facing description. Single string or [pending, success, error, replaced].
        error:
          $ref: "#/components/schemas/TuwaErrorState"
        finishedTimestamp:
          type: number
          description: On-chain timestamp (seconds) when finalized.
        from:
          type: string
          description: Sender's wallet address.
        isError:
          type: boolean
          description: Whether the transaction is in a failed state.
        isTrackedModalOpen:
          type: boolean
        localTimestamp:
          type: number
          description: Local timestamp (seconds) when initiated by user.
        payload:
          type: object
          additionalProperties:
            anyOf:
              - type: string
              - type: number
          description: Arbitrary custom data associated with the transaction.
        pending:
          type: boolean
          description: Whether the transaction is awaiting on-chain confirmation.
        status:
          $ref: "#/components/schemas/TransactionStatus"
        title:
          anyOf:
            - type: string
            - type: array
              prefixItems:
                - type: string
                - type: string
                - type: string
                - type: string
          description: User-facing title. Single string or [pending, success, error, replaced].
        tracker:
          $ref: "#/components/schemas/TransactionTracker"
        txKey:
          type: string
          description: Unique key of the transaction, set by Pulsar (for example the transaction hash).
        type:
          type: string
          description: Application-specific transaction category (e.g. "SWAP", "APPROVE").
        connectorType:
          type: string
          description: Connector type of the wallet, e.g. "evm:metamask".
        requiredConfirmations:
          type: number
          description: Number of confirmations required.
        confirmations:
          anyOf:
            - type: number
            - type: string
            - type: "null"
          description: Number of confirmations or finality status.
        rpcUrl:
          type: string
          description: RPC URL used for submission.
        syncStatus:
          type: string
          enum:
            - synced
            - pending-sync
          description: Status of cloud synchronization.
        adapter:
          type: string
          enum:
            - solana
        fee:
          type: number
          description: Transaction fee in lamports.
        instructions:
          type: array
          items: {}
          description: Transaction instructions.
        recentBlockhash:
          type: string
          description: Recent blockhash used.
        slot:
          type: number
          description: Slot in which the transaction was processed.
        confirmationStatus:
          type: string
          enum:
            - processed
            - confirmed
            - finalized
          description: Commitment the transaction reached. Quasar records `confirmed` once a supermajority voted on it and
            `finalized` when it marks it `Success`.
        lastValidBlockHeight:
          type: integer
          description: Last block height at which the blockhash of the transaction is valid (saved by `signAndSendSolanaTx` of
            `@tuwaio/pulsar-solana`). When the chain passes it and the signature is still unknown, Quasar marks the
            transaction `Failed` as expired; without it, after one hour.
      required:
        - chainId
        - from
        - localTimestamp
        - pending
        - tracker
        - txKey
        - type
        - connectorType
        - adapter
    StarknetTransaction:
      type: object
