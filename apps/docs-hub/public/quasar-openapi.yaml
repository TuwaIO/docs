        "429":
          description: "`rate_limited`: 120 calls a minute per token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
  /v1/payments/checkout/{token}/permission:
    post:
      tags:
        - Checkout
      summary: Grant automatic charges
      description: "The wallet's answer to `wallet_grantPermissions` for a subscription with `auto_charge`, checked by its
        context and screened like a payer. No key: the token opens this invoice only; a browser may call from the app's
        domains (any, when it lists none)."
      parameters:
        - schema:
            type: string
            description: The checkout token of the invoice.
          required: true
          description: The checkout token of the invoice.
          name: token
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payer:
                  type: string
                context:
                  type: string
                delegationManager:
                  type: string
                dependencies:
                  type: array
                  items:
                    type: object
                    properties:
                      factory:
                        type: string
                      factoryData:
                        type: string
                    required:
                      - factory
                      - factoryData
              required:
                - payer
                - context
                - delegationManager
      responses:
        "200":
          description: The permission.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permission:
                    type:
                      - object
                      - "null"
                    properties:
                      status:
                        type: string
                        enum:
                          - active
                          - revoked
                          - expired
                      chainId:
                        type:
                          - string
                          - "null"
                      methodId:
                        type:
                          - string
                          - "null"
                      payer:
                        type:
                          - string
                          - "null"
                      tokenAddress:
                        type:
                          - string
                          - "null"
                      periodAmount:
                        type:
                          - string
                          - "null"
                      periodSeconds:
                        type: number
                      startsAt:
                        type:
                          - string
                          - "null"
                      expiresAt:
                        type:
                          - string
                          - "null"
                      grantedAt:
                        type:
                          - string
                          - "null"
                      revokedAt:
                        type:
                          - string
                          - "null"
                    required:
                      - status
                      - chainId
                      - methodId
                      - payer
                      - tokenAddress
                      - periodAmount
                      - periodSeconds
                      - startsAt
                      - expiresAt
                      - grantedAt
                      - revokedAt
                    description: The ERC-7715 permission of `auto_charge`, without its context.
                required:
                  - permission
        "400":
          description: "`payer_chain_mismatch`, a context that does not grant the requested terms."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "403":
          description: "`origin_not_allowed`, `payments_disabled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "404":
          description: "`checkout_not_found`: a wrong or replaced token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "409":
          description: "`subscription_not_active`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
        "429":
          description: "`rate_limited`: 120 calls a minute per token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsError"
